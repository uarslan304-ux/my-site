<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Asistan</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            color: #e0e0e0;
            font-family: 'Segoe UI', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            padding: 16px 24px;
            border-bottom: 1px solid #1f1f1f;
            font-size: 18px;
            font-weight: 600;
            color: #fff;
        }
        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .msg {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.6;
            font-size: 15px;
        }
        .msg.user {
            background: #1e3a5f;
            align-self: flex-end;
        }
        .msg.ai {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            align-self: flex-start;
        }
        #input-area {
            padding: 16px 24px;
            border-top: 1px solid #1f1f1f;
            display: flex;
            gap: 12px;
        }
        #input {
            flex: 1;
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            padding: 12px 16px;
            color: #e0e0e0;
            font-size: 15px;
            outline: none;
            resize: none;
        }
        #input:focus { border-color: #3a7bd5; }
        #send {
            background: #3a7bd5;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 20px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 500;
        }
        #send:hover { background: #2d64b8; }
        #send:disabled { background: #333; cursor: not-allowed; }
    </style>
</head>
<body>
    <header>AI Asistan</header>
    <div id="chat"></div>
    <div id="input-area">
        <textarea id="input" rows="2" placeholder="Bir şey sor..."></textarea>
        <button id="send">Gönder</button>
    </div>

    <script>
        const API_KEY = "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";
        const API_URL = "https://api.groq.com/openai/v1/chat/completions";
        const MODEL = "llama-3.3-70b-versatile";

        const chat = document.getElementById("chat");
        const input = document.getElementById("input");
        const send = document.getElementById("send");

        const history = [
            { role: "system", content: "Sen her konuda yardımcı olan güçlü bir AI asistanısın. Türkçe konuş." }
        ];

        function addMsg(text, role) {
            const div = document.createElement("div");
            div.className = `msg ${role}`;
            div.textContent = text;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
            return div;
        }

        async function sendMsg() {
            const text = input.value.trim();
            if (!text) return;

            input.value = "";
            send.disabled = true;
            addMsg(text, "user");
            history.push({ role: "user", content: text });

            const thinking = addMsg("Düşünüyor...", "ai");

            try {
                const res = await fetch(API_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${API_KEY}`
                    },
                    body: JSON.stringify({ model: MODEL, messages: history, max_tokens: 1024 })
                });

                const data = await res.json();
                const reply = data.choices[0].message.content;
                thinking.textContent = reply;
                history.push({ role: "assistant", content: reply });
            } catch (e) {
                thinking.textContent = "Hata oluştu, tekrar dene.";
            }

            send.disabled = false;
            input.focus();
        }

        send.addEventListener("click", sendMsg);
        input.addEventListener("keydown", e => {
            if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMsg(); }
        });
    </script>
</body>
</html>
